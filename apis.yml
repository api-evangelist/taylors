- aid: taylors:library-rest
  name: Taylor's Library Koha REST API
  x-operator: institution
  x-contract-author: Koha Development Team (https://koha-community.org/)
  description: >-
    REST API of the Taylor's University Library catalog, served under /api/v1 by a Koha integrated
    library system that Taylor's self-hosts (librarycatalogue.taylors.edu.my resolves through
    librarycatalogue.wip.taylors.edu.my to 103.145.154.51, Taylor's own infrastructure — no vendor
    CNAME). The live Swagger 2.0 definition is publicly retrievable and describes 213 paths across 76
    tags with 113 definitions; its info.contact is the Koha Development Team, so the DEPLOYMENT is
    Taylor's and the CONTRACT is the Koha community's. The OpenAPI documents registered here are a
    verified subset covering only the six resources whose object schemas were confirmed present in the
    live definition (patron, checkout, hold, item, library, item_type); they are refine-split per tag
    and are recorded as one surface, not six, because they describe one deployment. Collection and
    resource endpoints require authentication (HTTP 401 to anonymous clients); the specification
    document itself is public.
  humanURL: https://librarycatalogue.taylors.edu.my/

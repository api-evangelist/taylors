- aid: taylors:irepo-rest
  name: Taylor's e-Repository DSpace CRIS REST API
  x-operator: institution
  x-contract-author: DSpace CRIS (cris-2022.01.01)
  description: >-
    The Taylor's e-Repository runs DSpace CRIS 2022.01.01 self-hosted at irepo.taylors.edu.my
    (resolving through irepo.wip.taylors.edu.my to 103.145.155.17 — again Taylor's own infrastructure,
    no vendor CNAME) and exposes a HATEOAS HAL+JSON REST API at /server/api covering communities,
    collections, items, bundles, discovery, statistics and 21 external-source integrations. It holds
    research abstracts, theses, dissertations, academic profiles, articles and creative works from
    Taylor's faculty, staff and students. The API root and /discover/search/objects answer anonymously;
    /core/items returns 401. The contract is the DSpace CRIS product's, the deployment and its content
    are Taylor's. Note that the OpenAIRE CERIF service description advertised on the OAI endpoint is
    still DSpace default boilerplate (unresolved ${dspace.url} placeholders and the stock "An example
    CRIS…" text), so OpenAIRE CERIF compliance is advertised but not configured.
  humanURL: https://irepo.taylors.edu.my/

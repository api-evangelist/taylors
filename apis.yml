aid: taylors
name: Taylor's University
x-type: university
x-category: Private Research University
description: >-
  Taylor's University is a private research university in Subang Jaya, Selangor, Malaysia, ranked #251
  in the QS World University Rankings 2025. It operates no developer portal, no public API programme
  and no public code: the Taylors-University GitHub organisation has existed since 2020 and still holds
  zero public repositories. What it does operate, on its own infrastructure under taylors.edu.my, are
  four live machine-readable surfaces — a self-hosted Koha library system exposing a REST API at
  /api/v1 and an OAI-PMH 2.0 data provider, and a self-hosted DSpace CRIS e-Repository exposing a
  HAL+JSON REST API at /server/api and a second OAI-PMH 2.0 provider. Both REST contracts are the
  upstream products' own documents (Koha Development Team; DSpace CRIS 2022.01.01) running on Taylor's
  servers: the deployment, the data and the DOIs are the institution's, the contract is not. Identity
  runs through a Microsoft Entra ID tenant whose SAML 2.0 and OpenID Connect metadata are publicly
  retrievable, and the institution is registered with ROR and holds a Crossref membership through
  Taylor's University Press. No open data portal, no course-catalog or timetable API, and no
  institution-operated developer documentation were found.

- aid: taylors:entra-identity-federation
  name: Taylor's University Identity Federation (Microsoft Entra ID)
  x-operator: federation
  description: >-
    Taylor's operates a Microsoft Entra ID tenant, 0a39ee13-5c27-420c-b0af-8e65c6929055, branded
    "Taylor's Education Group", as the identity provider behind taylors.edu.my. The realm is
    NameSpaceType "Managed" — cloud-native, not federated to an on-premises AD FS — and both its SAML
    2.0 federation metadata (entityID https://sts.windows.net/0a39ee13-5c27-420c-b0af-8e65c6929055/,
    signed, 28KB) and its OpenID Connect discovery document are publicly retrievable. This is the
    institution's own identity surface: a federation is shared by definition and the IdP behind it is
    theirs. Taylor's does NOT appear in eduGAIN, and Malaysia's national federation SIFULAN carries no
    Taylor's entity, so Entra ID is the whole of the federation story here. The Koha catalog integrates
    this tenant for OPAC sign-in.
  humanURL: https://university.taylors.edu.my/en.html
  baseURL: https://login.microsoftonline.com/0a39ee13-5c27-420c-b0af-8e65c6929055/v2.0
